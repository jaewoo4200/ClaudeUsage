name: ClaudeUsage
options:
  bundleIdPrefix: app
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    PRODUCT_BUNDLE_IDENTIFIER: app.claudeusage
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Sources/ClaudeUsage/Resources/Info.plist
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Universal Binary: Intel + Apple Silicon 모두 지원
    ARCHS: "x86_64 arm64"
    ONLY_ACTIVE_ARCH: NO

targets:
  ClaudeUsage:
    type: application
    platform: macOS
    sources:
      - path: Sources/ClaudeUsage
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: Sources/ClaudeUsage/Resources
        excludes:
          - "Info.plist"
    info:
      path: Sources/ClaudeUsage/Resources/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        CFBundleDisplayName: Claude Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        NSHumanReadableCopyright: "© 2026 Jaewoo Lee · MIT Licensed"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Sources/ClaudeUsage/Resources/ClaudeUsage.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
